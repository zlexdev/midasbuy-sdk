name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Codegen drift
        run: |
          python scripts/codegen.py
          git diff --exit-code -- src/midasbuy_sdk/models/_generated.py src/midasbuy_sdk/_sync \
            || (echo "::error::generated code is stale — run scripts/codegen.py and commit" && exit 1)

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

  import-clean:
    # Runtime deps only (no [dev]) — catches an undeclared runtime dep that the
    # dev env hides. A live smoke found pydantic EmailStr needing email-validator
    # at import time; this job is the standing guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (runtime only) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import midasbuy_sdk; print(midasbuy_sdk.__version__)"
